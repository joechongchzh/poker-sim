<script>
'use strict';
/* ============ 牌与评估 ============ */
const RANKS='23456789TJQKA', SUITS='shdc', SYM={s:'♠',h:'♥',d:'♦',c:'♣'};
const rv=c=>RANKS.indexOf(c[0]);
const disp=c=>(c[0]==='T'?'10':c[0])+SYM[c[1]];
function newDeck(){const d=[];for(const r of RANKS)for(const s of SUITS)d.push(r+s);
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}return d;}
function rank5(cs){
  const rs=cs.map(rv).sort((a,b)=>b-a);
  const fl=new Set(cs.map(c=>c[1])).size===1;
  const u=[...new Set(rs)].sort((a,b)=>b-a);
  let sh=-1;
  if(u.length===5){if(u[0]-u[4]===4)sh=u[0];else if(u.join(',')==='12,3,2,1,0')sh=3;}
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g=Object.entries(cnt).map(([r,n])=>[+r,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  const pat=g.map(x=>x[1]).join(''),od=g.map(x=>x[0]);
  if(fl&&sh>=0)return[8,sh];
  if(pat==='41')return[7,...od];
  if(pat==='32')return[6,...od];
  if(fl)return[5,...rs];
  if(sh>=0)return[4,sh];
  if(pat==='311')return[3,...od];
  if(pat==='221')return[2,...od];
  if(pat==='2111')return[1,...od];
  return[0,...rs];
}
function cmpR(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d;}return 0;}
function best(c7){
  let br=null,bc=null;const n=c7.length;
  for(let a=0;a<n-4;a++)for(let b=a+1;b<n-3;b++)for(let c=b+1;c<n-2;c++)for(let d=c+1;d<n-1;d++)for(let e=d+1;e<n;e++){
    const cs=[c7[a],c7[b],c7[c],c7[d],c7[e]],r=rank5(cs);
    if(!br||cmpR(r,br)>0){br=r;bc=cs;}
  }
  return{r:br,cards:bc};
}
const HANDNAME=['High Card','Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];
/* Chen公式翻前强度 */
function chen(hole){
  const [a,b]=hole.map(rv).sort((x,y)=>y-x);
  const hv=r=>r===12?10:r===11?8:r===10?7:r===9?6:(r+2)/2;
  let s=hv(a);
  if(a===b)return Math.max(s*2,5);
  if(hole[0][1]===hole[1][1])s+=2;
  const gap=a-b-1;
  s-=[0,1,2,4][Math.min(gap,3)]??5; if(gap>=4)s-=5-4;
  if(gap<=1&&a<10)s+=1;
  return s;
}
/* 翻后强度+听牌 */
function analyze(hole,board){
  const all=[...hole,...board],b=best(all),cat=b.r[0];
  const br=board.map(rv),hr=hole.map(rv);
  const bmax=Math.max(...br),bsort=[...new Set(br)].sort((x,y)=>y-x);
  const pocket=hr[0]===hr[1],boardPaired=new Set(br).size<br.length;
  let score;
  if(cat>=6)score=0.97;
  else if(cat===5)score=0.93;
  else if(cat===4)score=0.90;
  else if(cat===3){
    const tripr=b.r[1];
    if(pocket&&br.includes(hr[0]))score=0.91;
    else if(hr.includes(tripr))score=0.85;
    else score=0.52;
  }else if(cat===2){
    const k=new Set(hr.filter(r=>br.includes(r))).size;
    if(!pocket&&k>=2)score=0.80;
    else if(pocket&&boardPaired)score=hr[0]>bmax?0.72:0.55;
    else if(k===1&&boardPaired)score=hr.some(r=>r===bmax&&br.includes(r))?0.62:0.50;
    else score=0.60;
  }else if(cat===1){
    if(pocket)score=hr[0]>bmax?0.70:(hr[0]>=(bsort[1]??0)?0.45:0.36);
    else{const pr=b.r[1];
      if(hr.includes(pr)&&pr===bmax){const kick=Math.max(...hr.filter(r=>r!==pr).concat([0]));score=0.56+(kick>=11?0.10:kick>=9?0.05:0);}
      else if(hr.includes(pr))score=pr>=(bsort[1]??0)?0.42:0.34;
      else score=0.30;}
  }else score=hr.includes(12)?0.23:Math.max(...hr)>=10?0.14:0.07;
  let fd=false,nfd=false,oesd=false,gut=false,draw=0;
  if(board.length<5&&cat<5){
    const sc={};all.forEach(c=>sc[c[1]]=(sc[c[1]]||0)+1);
    for(const s in sc)if(sc[s]===4&&hole.some(h=>h[1]===s)){fd=true;nfd=hole.some(h=>h[1]===s&&h[0]==='A');}
    if(cat<4){
      const have=new Set(all.map(rv));const outs=new Set();
      const seqs=[];for(let i=0;i<9;i++)seqs.push(new Set([i,i+1,i+2,i+3,i+4]));seqs.push(new Set([12,0,1,2,3]));
      for(let r=0;r<13;r++){if(have.has(r))continue;
        for(const s5 of seqs){let ok=true;for(const x of s5)if(x!==r&&!have.has(x)){ok=false;break;}
          if(ok&&s5.has(r)&&hole.some(h=>s5.has(rv(h)))){outs.add(r);break;}}}
      if(outs.size>=2)oesd=true;else if(outs.size===1)gut=true;
    }
    draw=(fd?(nfd?0.16:0.13):0)+(oesd?0.12:gut?0.045:0);
    if(board.length===4)draw*=0.55;
  }
  return{cat,score,draw,fd,nfd,oesd,gut};
}
/* ============ 机器人 ============ */
function pickSizeWild(A,st){
  if(A.score>=0.8)return[0.75,1,1.3][Math.floor(Math.random()*3)];
  if((A.fd||A.oesd)&&st!=='river'&&Math.random()<0.22)return 1.5+Math.random()*1.8;
  return[0.45,0.6,1][Math.floor(Math.random()*3)];
}
function makeBrain(P){
  return{
    pre(p,ctx){
      let c=chen(p.hole)+(ctx.late?0.6:0)+(Math.random()-0.5)*0.8;
      const pocket=p.hole[0][0]===p.hole[1][0];
      const bbm=ctx.currentBet/ctx.bb;
      if(ctx.raises===0){
        if(P.trapAA&&pocket&&(p.hole[0][0]==='A'||(p.hole[0][0]==='K'&&Math.random()<0.5))){p.trap=true;return{a:'call'};}
        const play=c>=P.openChen||Math.random()<P.openRand;
        if(!play)return{a:'fold'};
        if(c>=P.alwaysRaiseChen||Math.random()<P.pfrShare)
          return{a:'raise',to:Math.round((2.5+Math.random()*1.5+ctx.limpers*1+(P.bigOpen?1.5:0))*ctx.bb)};
        return P.canLimp?{a:'call'}:{a:'raise',to:Math.round((2.5+Math.random())*ctx.bb)};
      }
      if(ctx.raises===1){
        if(p.trap)return{a:'raise',to:Math.round(ctx.currentBet*(3+Math.random()))};
        if(c>=P.threeBetChen&&Math.random()<P.threeBetFreq)
          return{a:'raise',to:Math.round(ctx.currentBet*(3+ctx.callers)+Math.random()*ctx.bb)};
        const penalty=Math.max(0,bbm-2.5)*P.sizeElastic;
        if(c>=P.callChen+penalty)return{a:'call'};
        if(pocket&&ctx.stack/Math.max(ctx.toCall,1)>=13)return{a:'call'};
        return{a:'fold'};
      }
      /* 面对3bet+：这桌几乎没人弃(F3B≈16%) */
      if(c>=12&&Math.random()<0.5)return{a:'raise',to:Math.round(ctx.currentBet*2.6)};
      if(c>=P.call3Chen)return{a:'call'};
      if(pocket&&ctx.stack/Math.max(ctx.toCall,1)>=13)return{a:'call'};
      return Math.random()<P.sticky3?{a:'call'}:{a:'fold'};
    },
    post(p,ctx){
      const A=analyze(p.hole,ctx.board);
      const s=A.score+(ctx.street!=='river'?A.draw*P.drawWeight:0)+(Math.random()-0.5)*0.06;
      if(ctx.toCall===0){
        const canBluff=ctx.numActive<=2||Math.random()<0.3;
        const isRiver=ctx.street==='river';
        const wantValue=isRiver?A.score>=P.riverValueAt:A.score>=P.valueBetAt;
        const bluffP=isRiver?P.riverBluff:(ctx.isAggressor?P.cbet:P.stab);
        const semi=!isRiver&&A.draw>=0.1&&Math.random()<P.semibluff;
        const midCbet=!isRiver&&ctx.isAggressor&&A.score>=0.35&&Math.random()<P.cbet*0.55;
        if(wantValue||semi||midCbet||(A.score<0.35&&canBluff&&Math.random()<bluffP)){
          const frac=P.size?P.size(A,ctx.street):pickSizeWild(A,ctx.street);
          const amt=Math.max(ctx.bb,Math.round(frac*ctx.pot));
          return{a:'bet',to:amt};
        }
        return{a:'check'};
      }
      const req=ctx.toCall/(ctx.pot+ctx.toCall);
      if(ctx.canRaise&&s>=P.raiseAt&&Math.random()<P.raiseFreq)
        return{a:'raise',to:Math.round(ctx.currentBet*2.6+ctx.pot*0.2)};
      if(ctx.canRaise&&ctx.street!=='river'&&(A.fd||A.oesd)&&A.score<0.6&&Math.random()<P.drawRaise)
        return{a:'raise',to:Math.round(ctx.currentBet*(2.6+Math.random()*(P.wildDraw?3:0.6)))};
      let slack=P.slack;
      if(ctx.betRatio>=0.9)slack+=P.bigBetTighten;
      if(ctx.numActive>2)slack+=0.03;
      if(ctx.street==='river'&&ctx.betRatio>=0.7&&s<P.riverBigCallAt)return{a:'fold'};
      if(s>=req+slack)return{a:'call'};
      if(ctx.street!=='river'&&A.draw>=0.1&&req<=0.31)return{a:'call'};
      if(ctx.street!=='river'&&A.gut&&req<=0.16)return{a:'call'};
      return{a:'fold'};
    }
  };
}
const PROFILES={
  Terry:{openChen:3.5,openRand:0.55,pfrShare:0.38,alwaysRaiseChen:10,canLimp:true,trapAA:true,bigOpen:false,
    threeBetChen:10,threeBetFreq:0.45,callChen:3.2,sizeElastic:0.10,call3Chen:6,sticky3:0.4,
    cbet:0.59,stab:0.34,semibluff:0.5,drawRaise:0.30,wildDraw:true,valueBetAt:0.58,riverValueAt:0.60,riverBluff:0.10,
    slack:-0.14,bigBetTighten:0.02,raiseAt:0.80,raiseFreq:0.55,riverBigCallAt:0.48,drawWeight:1.35,size:null},
  '嗯哼':{openChen:6.2,openRand:0.13,pfrShare:0.55,alwaysRaiseChen:9,canLimp:true,trapAA:false,bigOpen:false,
    threeBetChen:9.2,threeBetFreq:0.6,callChen:4.8,sizeElastic:0.25,call3Chen:6,sticky3:0.7,
    cbet:0.77,stab:0.18,semibluff:0.35,drawRaise:0.04,valueBetAt:0.60,riverValueAt:0.60,riverBluff:0.02,
    slack:-0.20,bigBetTighten:0.04,raiseAt:0.82,raiseFreq:0.6,riverBigCallAt:0.44,drawWeight:1.0,
    size:(A,st)=>0.5+Math.random()*0.3},
  '高进':{openChen:6.5,openRand:0.12,pfrShare:1.0,alwaysRaiseChen:6.5,canLimp:false,trapAA:false,bigOpen:true,
    threeBetChen:9.8,threeBetFreq:0.55,callChen:6.8,sizeElastic:0.3,call3Chen:7,sticky3:0.6,
    cbet:0.68,stab:0.40,semibluff:0.3,drawRaise:0.08,valueBetAt:0.62,riverValueAt:0.76,riverBluff:0.03,
    slack:-0.02,bigBetTighten:0.10,raiseAt:0.80,raiseFreq:0.55,riverBigCallAt:0.62,drawWeight:1.0,
    size:(A,st)=>st==='flop'?0.5:(A.score>=0.75?1.0+Math.random()*0.35:0.5)},
  xiao:{openChen:5.2,openRand:0.26,pfrShare:0.12,alwaysRaiseChen:10.5,canLimp:true,trapAA:false,bigOpen:false,
    threeBetChen:10.5,threeBetFreq:0.3,callChen:3.9,sizeElastic:0.12,call3Chen:6.5,sticky3:0.5,
    cbet:0.45,stab:0.20,semibluff:0.2,drawRaise:0.02,valueBetAt:0.62,riverValueAt:0.66,riverBluff:0.02,
    slack:-0.10,bigBetTighten:0.12,raiseAt:0.88,raiseFreq:0.5,riverBigCallAt:0.50,drawWeight:1.0,
    size:(A,st)=>0.4+Math.random()*0.25},
  yq:{openChen:5.8,openRand:0.22,pfrShare:0.45,alwaysRaiseChen:8.5,canLimp:true,trapAA:false,bigOpen:false,

async function bettingRound(startIdx,st){
  let idx=startIdx,guard=0;
  let raisesCount=st==='preflop'?0:0,limpers=0,callersSinceRaise=0,lastAggr=null;
  while(guard++<300){
    if(activeP().length<=1)return;
    const need=players.filter(p=>!p.folded&&!p.allin&&(p.streetInv<currentBet||!p.acted));
    if(!need.length)return;
    const p=players[idx%players.length];idx++;
    if(p.folded||p.allin)continue;
    if(p.streetInv===currentBet&&p.acted)continue;
    const toCall=currentBet-p.streetInv;
    const maxTo=p.streetInv+p.stack;
    const others=activeP().filter(q=>q!==p&&!q.allin);
    const maxOther=Math.max(...activeP().filter(q=>q!==p).map(q=>q.streetInv+q.stack),0);
    const canRaise=maxTo>currentBet&&others.length>0;
    curActor=p;render();
    let dec;
    const potBefore=pot;
    const betRatio=lastAggr?lastAggr.addAmt/Math.max(lastAggr.potBefore,1):0;
    if(p.isHero&&autoHands<=0){
      dec=await heroDecide({toCall,canRaise,maxTo,potBefore});
    }else{
      await sleep(280+Math.random()*550);
      const brain=p.brain||makeBrain(PROFILES.yq);
      const late=[dealerIdx,(dealerIdx+5)%6].includes(players.indexOf(p));
      dec=st==='preflop'
        ?brain.pre(p,{bb:BBAMT,currentBet,toCall,stack:p.stack,raises:raisesCount,limpers,callers:callersSinceRaise,late})
        :brain.post(p,{street:st,board,toCall,pot,currentBet,stack:p.stack,bb:BBAMT,
            isAggressor:lastAggrPrev===p,numActive:activeP().length,betRatio,canRaise});
    }
    /* 规范化决策为合法动作 */
    let a=dec.a,to=dec.to||0;
    if(a==='fold'&&toCall===0)a='check';
    if((a==='bet'||a==='raise')&&!canRaise)a=toCall>0?'call':'check';
    if(a==='call'&&toCall===0)a='check';
    if(a==='fold'){
      p.folded=true;p.acted=true;p.lastAct='弃牌';
      log(`"${p.full}" folds`);feed(`${p.nm} 弃牌`,p.isHero?'me':'');
    }else if(a==='check'){
      p.acted=true;p.lastAct='过牌';
      log(`"${p.full}" checks`);feed(`${p.nm} 过牌`,p.isHero?'me':'');
    }else if(a==='call'){
      const pay=Math.min(toCall,p.stack);
      p.stack-=pay;p.streetInv+=pay;p.totalInv+=pay;pot+=pay;
      if(p.stack===0)p.allin=true;
      p.acted=true;p.lastAct='跟注'+p.streetInv+(p.allin?' 全下':'');
      log(`"${p.full}" calls ${p.streetInv}${p.allin?' and go all in':''}`);
      feed(`${p.nm} 跟注 ${p.streetInv}${p.allin?'（全下）':''}`,p.isHero?'me':'');
      if(st==='preflop'){if(raisesCount===0)limpers++;else callersSinceRaise++;}
    }else{/* bet/raise to */
      to=Math.round(to);
      const minTo=currentBet===0?Math.min(BBAMT,maxTo):Math.min(currentBet+minRaise,maxTo);
      to=Math.max(to,minTo);to=Math.min(to,maxTo);
      if(to<=currentBet){/* 凑不出加注→跟注 */
        const pay=Math.min(toCall,p.stack);
        p.stack-=pay;p.streetInv+=pay;p.totalInv+=pay;pot+=pay;
        if(p.stack===0)p.allin=true;p.acted=true;
        log(`"${p.full}" calls ${p.streetInv}${p.allin?' and go all in':''}`);
        feed(`${p.nm} 跟注 ${p.streetInv}`,p.isHero?'me':'');
      }else{
        const addAmt=to-currentBet,fullRaise=addAmt>=minRaise||to===maxTo&&addAmt>=minRaise;
        const pay=to-p.streetInv;
        const potB4=pot;
        p.stack-=pay;p.streetInv=to;p.totalInv+=pay;pot+=pay;
        if(p.stack===0)p.allin=true;
        const verb=currentBet===0?'bets':'raises to';
        log(`"${p.full}" ${verb} ${to}${p.allin?' and go all in':''}`);
        feed(`${p.nm} ${currentBet===0?'下注':'加注到'} ${to}${p.allin?'（全下）':''}`,p.isHero?'me':'');
        p.lastAct=(currentBet===0?'下注':'加注')+to;
        if(addAmt>=minRaise){minRaise=addAmt;players.forEach(q=>{if(q!==p)q.acted=false;});}
        lastAggr={p,addAmt:to-(currentBet===0?0:currentBet),potBefore:potB4-(to-p.streetInv>0?0:0)};
        lastAggr.potBefore=potB4;
        currentBet=to;p.acted=true;
        if(st==='preflop'){raisesCount++;callersSinceRaise=0;}
        lastAggrPrev=p;
      }
    }
    curActor=null;render();
  }
}
let lastAggrPrev=null;
async function settle(heroStart){
  /* 未被跟注部分退回 */
  const invs=players.map(p=>p.totalInv);
  const sorted=[...invs].sort((a,b)=>b-a);
  if(sorted[0]>sorted[1]){
    const p=players.find(q=>q.totalInv===sorted[0]);
    const diff=sorted[0]-sorted[1];
    p.stack+=diff;p.totalInv-=diff;pot-=diff;
    log(`Uncalled bet of ${diff} returned to "${p.full}"`);
  }
  const remain=activeP();
  if(remain.length===1){
    const w=remain[0];const amt=players.reduce((s,p)=>s+p.totalInv,0);
    w.stack+=amt;
    log(`"${w.full}" collected ${amt} from pot`);
    feed(`${w.nm} 收池 ${amt}`,w.isHero?'me':'');
    msg(`${w.nm} 收下 ${amt}`);
  }else{
    /* 摊牌 */
    render(true);await sleep(600);
    const n=players.length,sbIdx=(dealerIdx+1)%n;
    const showOrder=[];
    for(let k=0;k<n;k++){const p=players[(sbIdx+k)%n];if(!p.folded)showOrder.push(p);}
    for(const p of showOrder){
      log(`"${p.full}" shows a ${disp(p.hole[0])} ${disp(p.hole[1])}.`);
      feed(`${p.nm} 亮牌 ${disp(p.hole[0])} ${disp(p.hole[1])}`,p.isHero?'me':'');
    }
    /* 边池分层 */
    const contrib=new Map(players.filter(p=>p.totalInv>0).map(p=>[p,p.totalInv]));
    const pots=[];
    for(let guard=0;guard<20;guard++){
      const entries=[...contrib].filter(([,c])=>c>0);
      if(!entries.length)break;
      const inPlay=entries.filter(([p])=>!p.folded);
      if(!inPlay.length){pots[pots.length-1].amount+=entries.reduce((s,[,c])=>s+c,0);break;}
      const lvl=Math.min(...inPlay.map(([,c])=>c));
      let amt=0;
      for(const[p,c]of contrib){const take=Math.min(c,lvl);amt+=take;contrib.set(p,c-take);}
      pots.push({amount:amt,eligible:inPlay.map(([p])=>p)});
    }
    for(const pt of pots){
      let bestRank=null;const evals=new Map();
      for(const p of pt.eligible){const e=best([...p.hole,...board]);evals.set(p,e);
        if(!bestRank||cmpR(e.r,bestRank)>0)bestRank=e.r;}
      const winners=pt.eligible.filter(p=>cmpR(evals.get(p).r,bestRank)===0);
      const share=Math.floor(pt.amount/winners.length);
      let rem=pt.amount-share*winners.length;
      for(const w of winners){
        const got=share+(rem>0?1:0);if(rem>0)rem--;
        w.stack+=got;
        const e=evals.get(w);
        log(`"${w.full}" collected ${got} from pot with ${HANDNAME[e.r[0]]} (combination: ${e.cards.map(disp).join(', ')})`);
        feed(`${w.nm} 以 ${HANDNAME[e.r[0]]} 收池 ${got}`,w.isHero?'me':'');
      }
    }
    const wnames=[...new Set(pots.flatMap(pt=>{
      let bestRank=null;const ev=new Map();
      pt.eligible.forEach(p=>{const e=best([...p.hole,...board]);ev.set(p,e);if(!bestRank||cmpR(e.r,bestRank)>0)bestRank=e.r;});
      return pt.eligible.filter(p=>cmpR(ev.get(p).r,bestRank)===0).map(p=>p.nm);
    }))];
    msg(`摊牌：${wnames.join('、')} 获胜`);
  }
  pot=0;
  log(`-- ending hand #${handNo} --`);
  const heroNet=HERO.stack-heroStart;
  heroNetTotal+=heroNet;
  handRecords.unshift({no:handNo,cards:HERO.hole.map(disp).join(' '),net:heroNet,lines:curLines.slice()});
  renderHist();
}

function heroDecide(o){
  return new Promise(res=>{
    heroResolve=res;
    const{toCall,canRaise,maxTo,potBefore}=o;
    $('abInfo').textContent=`底池 ${pot} ｜ 需跟 ${toCall} ｜ 你的筹码 ${HERO.stack}`;
    $('btnFold').style.display=toCall>0?'':'none';
    $('btnCheck').style.display=toCall===0?'':'none';
    $('btnCall').style.display=toCall>0?'':'none';
    $('btnCall').textContent=toCall>=HERO.stack?`跟注 ${HERO.stack}（全下）`:`跟注 ${toCall}`;
    $('btnBet').style.display=canRaise?'':'none';
    $('btnBet').textContent=currentBet===0?'下注':'加注到';
    $('betctl').style.display=canRaise?'flex':'none';
    if(canRaise){
      const minTo=currentBet===0?Math.min(BBAMT,maxTo):Math.min(currentBet+minRaise,maxTo);
      const r=$('betRange'),a=$('betAmt');
      r.min=minTo;r.max=maxTo;r.value=Math.min(Math.max(Math.round(pot*0.75+toCall)+HERO.streetInv,minTo),maxTo);
      a.value=r.value;
      document.querySelectorAll('.preset').forEach(b=>{
        b.onclick=()=>{const f=+b.dataset.f;
          let v=f<0?maxTo:Math.round(toCall+pot*f)+HERO.streetInv;
          v=Math.min(Math.max(v,minTo),maxTo);r.value=v;a.value=v;};
      });
      r.oninput=()=>a.value=r.value;
      a.oninput=()=>r.value=a.value;
    }
    ['btnFold','btnCheck','btnCall','btnBet'].forEach(id=>$(id).classList.add('pulse'));
  });
}
function heroAct(a){
  if(!heroResolve)return;
  const res=heroResolve;heroResolve=null;
  ['btnFold','btnCheck','btnCall','btnBet'].forEach(id=>{$(id).classList.remove('pulse');$(id).style.display='none';});
  $('betctl').style.display='none';
  $('abInfo').textContent='…';
  if(a==='bet'){
    let v=Math.round(+$('betAmt').value)||0;
    res({a:currentBet===0?'bet':'raise',to:v});
  }else res({a});
}

$('btnStart').onclick=()=>{if(!running)mainLoop();};
$('btnAddon').onclick=()=>{
  const v=parseInt(prompt('补码数额（下一手开始时生效）：','2000'),10);
  if(v>0){pendingAddon+=v;msg(`已登记补码 ${pendingAddon}，下一手生效`);}
};
$('btnSeat').onclick=()=>{
  const cur=players.indexOf(HERO)+1;
  const v=parseInt(prompt(`换到几号座位(1-6)？当前${cur}号位。\n`+players.map((p,i)=>`${i+1}:${p.nm}`).join('  '),''),10);
  if(v>=1&&v<=6&&v!==cur){pendingSeat=v;msg(`已登记换位到${v}号位，下一手生效`);}
};
$('btnPause').onclick=()=>{paused=!paused;$('btnPause').textContent=paused?'继续':'暂停';};
$('tabFeed').onclick=()=>{$('tabFeed').classList.add('on');$('tabHist').classList.remove('on');$('feed').classList.add('on');$('hist').classList.remove('on');};
$('tabHist').onclick=()=>{$('tabHist').classList.add('on');$('tabFeed').classList.remove('on');$('hist').classList.add('on');$('feed').classList.remove('on');};
buildSeats();render();
/* 测试钩子: 控制台执行 simAuto(30) 让英雄自动打30手(用yq策略), 之后 getCSV() 取牌谱 */
window.simAuto=n=>{autoHands=n;if(!running)mainLoop();};
window.getCSV=exportCSV;
window.simState=()=>({handNo,logs:logs.length,heroNetTotal,stacks:players.map(p=>[p.nm,p.stack])});
</script>
</body>
</html>
